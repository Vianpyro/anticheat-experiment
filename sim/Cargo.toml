[package]
name = "sim"
description = "Deterministic game rules: State, Input, step, view_for, fixed-point math."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

# The one crate that does not inherit the workspace version, and the reason is
# `docs/RISKS.md` R13. `rules_hash()` covers the constants but not the order of
# operations in `step`, so two builds can agree on the rules hash and still
# resimulate a replay differently. This number is what tells them apart, and a
# number that has to be remembered is a number that will be forgotten — the
# same class of failure as a field missing from the digest, without a compiler
# to catch it. So the `sim-version` job in `.github/workflows/determinism.yml`
# refuses a pull request that touches `sim/` without raising it, and the rest of
# the workspace keeps inheriting `workspace.package.version`.
#
# Bump the patch for a change that cannot alter a single digest (a comment, a
# test, a doc), the minor for anything that can. When in doubt it is the minor:
# the cost of an unnecessary bump is a line in a diff, and the cost of a missing
# one is a replay that verifies against the wrong build.
version = "0.4.0"

# Empty, and meant to stay empty. `docs/ARCHITECTURE.md` allows a fixed-point
# crate and `serde` for the view types; this crate takes neither. The
# fixed-point type is thirty lines of integer arithmetic whose overflow
# semantics are a decision this project has to make and document anyway
# (see `src/fx.rs`), and a dependency there is a dependency that can change
# rounding in a patch release — which is `docs/RISKS.md` R9 exactly.
[dependencies]

# `proptest` pulls in `rand`, which the `clippy.toml` disallows *by name* in
# this crate's own code. That is not a contradiction: the ban exists so no rule
# draws from an ambiently-seeded generator, and a dev-dependency used by a test
# harness to choose which inputs to try is the opposite situation — its draws
# never reach a `State`. Every test that needs randomness inside the simulation
# uses `sim::Rng` with a written-down seed.
[dev-dependencies]
proptest = "1.11.0"
