[package]
name = "client"
description = "Presentation: rendering, input capture, prediction, reconciliation."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "moba-client"
path = "src/main.rs"

# The playtest tool: it fills the seats nobody is sitting in so that one or two
# people can start a nine-seat match. It is in *this* crate and not in
# `cheat-client` deliberately — `docs/ARCHITECTURE.md` makes that crate the
# machine this project assumes is compromised, `ci` asserts that no production
# binary links it, and `docs/RISKS.md` R7 refuses to hand anybody a usable
# attacker. `client::bot` reimplements the decision logic rather than linking
# it, which costs eighty lines and keeps all three of those true.
[[bin]]
name = "moba-bots"
path = "src/bin/bots.rs"

[dependencies]
protocol = { path = "../protocol" }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging", "tls12"] }
sim = { path = "../sim" }

# The framebuffer. `docs/ARCHITECTURE.md` records why the pixels are drawn on
# the CPU rather than through `wgpu`: the scene is nine discs and six towers, a
# GPU pipeline is a driver requirement at run time and forty more crates at
# build time, and a CPU rasteriser leaves `client::draw::rasterize` a pure
# function of a slice — so the renderer keeps its tests in a CI job that has no
# display. `x11-dlopen` and `wayland-dlopen` so that neither backend needs a
# system development package to build; `kms` is off because a console
# framebuffer is not a platform in `docs/ENGINEERING.md`'s matrix.
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

# The window and, the reason this dependency is here at all, the input. `winit`
# is the layer that surfaces unaccelerated device motion on every platform in
# the matrix — `XI_RawMotion` on X11, `zwp_relative_pointer_v1` on Wayland,
# `WM_INPUT` on Windows — which is what `docs/RISKS.md` R14's successor is
# about. `wayland-csd-adwaita` is deliberately off: it is the client-side
# decoration theme and it drags in a font rasteriser, which is the font stack
# R14 counted against a windowed client in the first place.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

# `server`, for the in-process harness that runs M3's exit criterion, and
# nothing else. `docs/ARCHITECTURE.md` forbids `client` a *normal* dependency on
# `server` and that stands — the check in `ci` is `cargo tree -p client --edges
# normal`, which excludes this. It is the same allowance `cheat-client` already
# has and for the same reason: the criterion is three clients and one server in
# one process, and the alternative is an eighth crate whose only content is a
# test.
[dev-dependencies]
# `replay`, for the two exit criteria that have to seal a match before
# `replay verify` can be asked to resimulate it. Since M5 this project has one
# file format and it is signed, so a criterion that wrote an unsigned container
# would be exercising a format that no longer exists.
#
# `docs/ARCHITECTURE.md` forbids `client` **`replay`'s signing keys**, and that
# stands exactly as written: what it is about is a shipped client able to seal a
# replay, and the key in `client/tests/harness` is a written-down constant in a
# test binary. The enforced claim is about the *normal* graph — `cargo tree -p
# client --edges normal` shows no path to `replay` either — and a dev-dependency
# is not that. It is the same allowance `server` already has below.
replay = { path = "../replay" }
server = { path = "../server" }
