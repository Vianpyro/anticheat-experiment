name: release

# The only workflow in this repository that writes anything, and
# `docs/RISKS.md` R12 is the reason every line of it is shaped the way it is.
# Until now a compromised action could read a public checkout and poison a build
# cache; here it could mint a release in this project's name. Three consequences,
# all of them visible below:
#
#   1. Every action is pinned by commit SHA with its tag in a trailing comment,
#      exactly as `ci.yml` does. R12 states this as a precondition on M9 rather
#      than a hope, and it is the condition this file merges under.
#   2. Permissions are declared on the job that needs them and never here. Five
#      jobs run; three hold `contents: write`, one holds `packages: write`, and
#      the build matrix — the job that runs the most code — holds the smallest
#      set it can do its work with.
#   3. There is no build cache in this workflow. `Swatinem/rust-cache` is in
#      `ci` and `determinism` deliberately and stays there; a poisoned cache
#      entry reaching a released binary is precisely the blast radius R12
#      describes, and a release compiles from scratch once per tag.
#
# `id-token: write` and `attestations: write` are declared on exactly one job,
# `attest`, and on no other. They arrived with the thing that uses them rather
# than before it, which is what `docs/ENGINEERING.md` asks and what the previous
# version of this comment was holding the line on. That job compiles nothing and
# its whole body is one action over a list of files somebody else produced. It
# does also hold `contents: write`, because a draft release is invisible to a
# read-scoped token, and the comment on the job says so rather than leaving a
# reader to find it.
#
# Five jobs became six. The three items M9's exit criterion was missing — an
# SBOM, a provenance attestation, and checksums that are actually signed by
# something — are the `Generate the SBOMs` step in the build matrix and the
# `attest` job at the bottom.
#
# What triggers it: a tag that already exists. This file never invents a version
# — it is handed one, and it refuses it if the commit disagrees.
#
# Two ways in, one behaviour. `cd.yml` tags the merge of a release pull request
# and then sends a `repository_dispatch`, because a tag pushed by `GITHUB_TOKEN`
# starts no workflow — GitHub does not run workflows on events its own token
# created, and `repository_dispatch` is one of the two exceptions. A tag pushed
# by a person starts this the ordinary way. Both resolve the same `TAG` and both
# check out that tag explicitly rather than trusting the ref they arrived on,
# which is what makes the two paths the same build.
on:
  push:
    tags:
      - "v*"
  repository_dispatch:
    types: [release]

# Elevate per job, never here.
permissions:
  contents: read

# Never cancel a release in flight. `ci` cancels superseded runs because a
# superseded check is worthless; a superseded release is a half-uploaded set of
# assets.
concurrency:
  group: release-${{ github.event.client_payload.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The tag this run is about, whichever door it came in by. Every job reads it
  # from here and every checkout pins itself to it.
  TAG: ${{ github.event.client_payload.tag || github.ref_name }}

jobs:
  # The draft exists before anything is built, for two reasons. It is where the
  # matrix jobs put their archives, which is what lets this workflow move
  # binaries between jobs without `upload-artifact`/`download-artifact` — two
  # more third-party actions in the one workflow holding a write token. And a
  # draft is invisible to everyone but the repository's owners, so a run that
  # dies halfway leaves an unpublished draft rather than a release advertising
  # three of its six binaries.
  draft:
    name: draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tag, explicitly. A `repository_dispatch` run arrives on
          # `main`, so trusting the default ref would build whatever has
          # landed since the merge rather than what was tagged.
          ref: ${{ github.event.client_payload.tag || github.ref_name }}

      # The tag says a version exists; the manifest says which version this
      # commit *is*. On the automatic path `cd.yml` has already checked they
      # agree, and this is deliberately not trusting it: a tag pushed by hand
      # comes in the other door, and tagging before the release pull request is
      # merged is the mistake that door makes possible. It cost one failed run
      # on `v0.1.0` and no artefacts, which is what this check is for.
      - name: The tag and the workspace version must agree
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$TAG"
          version="${tag#v}"

          # `[workspace.package] version`, which every crate but `sim` inherits
          # (`sim` owns its own for `docs/RISKS.md` R13, and it is not what a
          # release is named after).
          manifest=$(sed -n 's/^version = "\([0-9][0-9A-Za-z.+-]*\)"$/\1/p' Cargo.toml | head -1)

          if [[ -z "$manifest" ]]; then
            echo "::error file=Cargo.toml::the workspace declares no version"
            exit 1
          fi
          if [[ "$version" != "$manifest" ]]; then
            echo "::error::tag $tag names version $version but this commit's workspace version is $manifest."
            echo "The release pull request that raises the version has to be merged before its tag exists."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ok: $tag builds workspace version $manifest"

      # The narrative of a release is generated from conventional commits by
      # `cd.yml` and lives in `CHANGELOG.md`, which was merged with the release
      # pull request. This lifts out the one section this tag is about. It is
      # deliberately fatal when the section is missing: a release whose notes are
      # "see the commits" is a release nobody can read, and a missing section
      # means the tag and the changelog disagree about what is being published —
      # which is the same class of mistake as the version check above, and it
      # stops here for the same reason.
      - name: The changelog section for this tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md does not exist; cd.yml's release pull request is what creates it"
            exit 1
          fi

          # Keep-a-changelog, which is the shape `cd.yml` writes: `## [0.1.0]`
          # followed by a link and a date. Everything up to the next second-level
          # heading is this version's section.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > NOTES.md

          if [[ ! -s NOTES.md ]]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat NOTES.md

      - name: Create the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Idempotent, so that a re-run after a transient failure continues a
          # draft rather than failing on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ok: draft $TAG already exists; reusing it"
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file NOTES.md

  # Client and server, natively on each platform in `docs/ENGINEERING.md`'s
  # matrix. No cross-compilation and no `cross`: three runners are what GitHub
  # already gives, and a cross-linked binary is a different artefact from the
  # one the determinism job proved anything about.
  build:
    name: ${{ matrix.target }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # A failure on one platform must not delete the evidence of the other
      # two: the draft keeps whatever succeeded, and the run says which target
      # did not.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tag, explicitly. A `repository_dispatch` run arrives on
          # `main`, so trusting the default ref would build whatever has
          # landed since the merge rather than what was tagged.
          ref: ${{ github.event.client_payload.tag || github.ref_name }}

      # `--locked`, which is the whole point of committing `Cargo.lock`: the
      # binary somebody downloads is built from the dependency graph `ci`,
      # `determinism` and `cargo-deny` all saw. A release that resolved fresh
      # versions would be a release nothing in this repository has checked.
      #
      # `--target` explicitly even where it is the host's own, so the artefact's
      # name is a fact from the build rather than a claim about the runner.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p client -p server

      # `cargo install` rather than an action, for the reason `docs/RISKS.md`
      # R12 gives about `cargo-deny` in `supply-chain`: a tool that reads a
      # lockfile is not worth another supply-chain surface in the workflow that
      # holds the write tokens. Pinned to an exact version for the same reason
      # the actions are pinned by SHA — a tool that decides what a release
      # claims about itself is not a tool that should move under the pipeline.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      # One SBOM per shipped binary per target, which is six for six archives.
      # The alternatives were both worse and both were tried: the tool's default
      # describes a *crate*, which on this workspace emits a bill of materials
      # for `anticheat`, `replay` and `moba-bots` as well — three things no
      # release contains — and `--target all` describes a union over platforms
      # this project does not ship, which is a superset that reports a
      # vulnerability in a dependency nobody downloaded. `--describe binaries`
      # on the target being built is the only one of the three whose answer is a
      # fact about an artefact somebody can hold.
      #
      # `--all` rather than `--top-level`, because the question an SBOM is
      # consumed to answer is whether a transitively vendored crate is in the
      # binary, and a top-level list cannot answer it.
      - name: Generate the SBOMs
        shell: bash
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all \
            --describe binaries \
            --target "$TARGET"

          # Named, moved and checked one at a time. The tool writes into each
          # crate's own directory and writes more files than a release ships,
          # so collecting them with a glob would attach a bill of materials for
          # a binary this workflow never built — the same rule the packaging
          # steps below follow, one step earlier.
          mv "client/moba-client_bin.cdx.json" "moba-client-v$VERSION-$TARGET.cdx.json"
          mv "server/moba-server_bin.cdx.json" "moba-server-v$VERSION-$TARGET.cdx.json"

          # `cargo cyclonedx` has no `--locked`, and every other cargo
          # invocation in this workflow does. If it ever re-resolved the graph,
          # the SBOM would describe a set of crates the binary beside it was not
          # built from — a bill of materials that is wrong in the direction
          # nobody checks, because it is the document people read *instead of*
          # opening the binary. There is no flag to pass, so the check is
          # whether the lockfile moved.
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::cargo-cyclonedx re-resolved the dependency graph; the SBOM does not describe the build"
            git diff --stat -- Cargo.lock
            exit 1
          fi

          # `ci` asserts that no production binary links `cheat-client`, by
          # reading the dependency graph. This asserts it from the other end, on
          # the document the release publishes about itself: an SBOM naming the
          # attack crate would be this project distributing a usable attacker
          # with a manifest saying so, which `docs/RISKS.md` R7 refuses. Two
          # independent witnesses to one invariant, and this is the one a
          # downloader can check without the repository.
          for crate in client server; do
            sbom="moba-$crate-v$VERSION-$TARGET.cdx.json"
            if grep -q '"name": "cheat-client"' "$sbom"; then
              echo "::error::$sbom names cheat-client; docs/RISKS.md R7"
              exit 1
            fi
            echo "ok: $sbom, $(grep -c '"purl":' "$sbom") components, no cheat-client"
          done

      # The archives, and this is where `docs/RISKS.md` R3 and R4 reach a
      # release workflow. Every file that goes into an archive is named on the
      # line that copies it. Nothing here globs a directory, walks the working
      # tree, or packages "the build output" — a recording, a consent record or
      # a signing key sitting untracked in a checkout is exactly what such a
      # glob would swallow, and the corpus is the one thing in this project
      # whose publication cannot be undone.
      #
      # `ci` refuses those shapes as *tracked* files, which is the check that
      # catches `git add -f`. This is the other side of the same rule: even a
      # checkout that contained one could not ship it.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release"

          for crate in client server; do
            name="moba-$crate-v$VERSION-$TARGET"
            mkdir -p "dist/$name"
            cp "$bin/moba-$crate" "dist/$name/moba-$crate"
            cp LICENSE "dist/$name/LICENSE"
            cp README.md "dist/$name/README.md"
            tar -C dist -czf "$name.tar.gz" "$name"
            tar -tzf "$name.tar.gz"
          done

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "target/$env:TARGET/release"

          foreach ($crate in @("client", "server")) {
            $name = "moba-$crate-v$env:VERSION-$env:TARGET"
            New-Item -ItemType Directory -Force "dist/$name" | Out-Null
            Copy-Item "$bin/moba-$crate.exe" "dist/$name/moba-$crate.exe"
            Copy-Item LICENSE "dist/$name/LICENSE"
            Copy-Item README.md "dist/$name/README.md"
            Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip" -Force
            Get-ChildItem "$name.zip"
          }

      # Two names, both written out. `gh release upload moba-*` would work and
      # is what a shorter workflow does; it is also a glob over a working
      # directory deciding what gets published, which is the thing this file
      # does not do anywhere.
      - name: Attach to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
          VERSION: ${{ needs.draft.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "moba-client-v$VERSION-$TARGET.$EXT" \
            "moba-server-v$VERSION-$TARGET.$EXT" \
            "moba-client-v$VERSION-$TARGET.cdx.json" \
            "moba-server-v$VERSION-$TARGET.cdx.json" \
            --clobber

  # SHA-256 for every artefact, in one file, computed from an enumerated list
  # rather than from whatever happens to be attached. The enumeration is doing
  # two jobs: it is the R3/R4 rule again — nothing is checksummed because it was
  # lying around — and it is a completeness check, because a release missing the
  # Windows server binary is otherwise a release that looks finished.
  #
  # It covers the SBOMs as well as the archives, and that is not symmetry for
  # its own sake: an SBOM is the document a downloader consults instead of
  # opening the binary, so an SBOM nobody can check is a place to lie about what
  # a binary contains. Twelve files, one list.
  checksums:
    name: checksums
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the twelve assets, by name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets

          expected=(
            "moba-client-v$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "moba-server-v$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "moba-client-v$VERSION-x86_64-pc-windows-msvc.zip"
            "moba-server-v$VERSION-x86_64-pc-windows-msvc.zip"
            "moba-client-v$VERSION-aarch64-apple-darwin.tar.gz"
            "moba-server-v$VERSION-aarch64-apple-darwin.tar.gz"
            "moba-client-v$VERSION-x86_64-unknown-linux-gnu.cdx.json"
            "moba-server-v$VERSION-x86_64-unknown-linux-gnu.cdx.json"
            "moba-client-v$VERSION-x86_64-pc-windows-msvc.cdx.json"
            "moba-server-v$VERSION-x86_64-pc-windows-msvc.cdx.json"
            "moba-client-v$VERSION-aarch64-apple-darwin.cdx.json"
            "moba-server-v$VERSION-aarch64-apple-darwin.cdx.json"
          )

          missing=0
          for asset in "${expected[@]}"; do
            gh release download "$TAG" --dir assets --pattern "$asset" || true
            if [[ ! -f "assets/$asset" ]]; then
              echo "::error::the release is missing $asset"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

          cd assets
          sha256sum "${expected[@]}" > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Attach the checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: gh release upload "$TAG" SHA256SUMS --clobber

  # The server image. `docs/ENGINEERING.md`: distroless base, non-root, and
  # `linux/amd64` only — cross-building `arm64` roughly doubles release time to
  # serve a user base that does not exist, and the day somebody asks is the day
  # it gets added.
  #
  # It compiles the server rather than unpacking the archive the Linux matrix
  # job just built, and that is a deliberate trade. Reading an asset off a
  # *draft* release needs push access, so pulling the binary here would mean
  # either publishing the release before it is finished or handing this job a
  # write token it otherwise has no use for — and this is the job that talks to
  # a registry. `docs/ENGINEERING.md` puts reproducible builds out of scope, so
  # the honest statement is that the image holds a sibling build of the same
  # commit and the same lockfile, not a byte-for-byte copy of the published
  # binary. If that ever needs to be an identity rather than a sibling, the fix
  # is to publish the image's own digest beside the checksums, not to loosen
  # this job's permissions.
  container:
    name: server image
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The image's own digest, which is what an attestation over a container
      # has to be about: a tag is a mutable pointer at a registry exactly as it
      # is at a git forge (`docs/RISKS.md` R12), so attesting `:v0.2.0` would
      # attest a name rather than a thing.
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tag, explicitly. A `repository_dispatch` run arrives on
          # `main`, so trusting the default ref would build whatever has
          # landed since the merge rather than what was tagged.
          ref: ${{ github.event.client_payload.tag || github.ref_name }}

      - name: Build the server
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p server

      # The build context is a directory this step creates and puts exactly one
      # file into. `docker build .` on the repository root would hand the daemon
      # the whole working tree — every untracked file in it — which is the R3/R4
      # glob this workflow refuses everywhere else. `.dockerignore` is the belt;
      # this is the braces, and it is the one that is actually load-bearing.
      - name: A build context containing one file
        run: |
          set -euo pipefail
          mkdir -p image-context
          cp target/x86_64-unknown-linux-gnu/release/moba-server image-context/moba-server
          ls -l image-context

      # `docker login` and `docker build` rather than `docker/login-action` and
      # `docker/build-push-action`: both are preinstalled on the runner, this
      # image is single-platform so there is no `buildx` matrix to drive, and
      # `docs/RISKS.md` R12 counts third-party actions. Three actions avoided in
      # the workflow that holds the write tokens is the trade R12 asks for.
      - name: Publish to ghcr.io
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
          # Through the environment rather than interpolated into the script, so
          # that the shell never sees a value the event payload controls.
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"

          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          docker build \
            -f server/Dockerfile \
            -t "$image:$TAG" \
            -t "$image:latest" \
            image-context

          # Non-root is a claim, so it is checked rather than asserted — this is
          # what would catch a base-image change that quietly reverted it. Read
          # out of the image's configuration rather than by running `id` in it,
          # because a distroless image has no shell to run `id` with, and that
          # is the point of a distroless image.
          user=$(docker image inspect --format '{{.Config.User}}' "$image:$TAG")
          echo "image user: ${user:-<unset>}"
          if [[ -z "$user" || "$user" == "root" || "$user" == 0 || "$user" == "0:0" ]]; then
            echo "::error::the server image runs as root (docs/ENGINEERING.md)"
            exit 1
          fi

          docker push "$image:$TAG"
          docker push "$image:latest"

          # Read back rather than parsed out of `docker push`'s progress
          # output, and required rather than defaulted to `unknown`: this
          # digest is the subject of an attestation now, and a job that shrugged
          # here would hand `attest` a name to sign instead of an image.
          repo_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$TAG")
          digest="${repo_digest##*@}"
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::the registry returned no digest for $image:$TAG"
            exit 1
          fi

          echo "digest: $repo_digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Provenance, which is the second of the two items `docs/MILESTONES.md` M9
  # recorded as missing and the one that changes what a downloader can know.
  #
  # A checksum says the file you have is the file the release names. It says
  # nothing about where that file came from, and it is signed by nothing — which
  # is why the criterion's phrase "signed checksums" was an overstatement for
  # two releases and is recorded as one. What an attestation adds is the other
  # half: this artefact was built by this workflow, from this commit, in this
  # repository, and the statement is signed by a Sigstore identity nobody in
  # this project holds a key for. There is no key to leak because there is no
  # key — the identity is the workflow's own OIDC token, valid for the minutes
  # this job runs.
  #
  # `actions/attest-build-provenance` is the **third** third-party action in
  # this repository, which is a number `docs/RISKS.md` R12 tracks deliberately.
  # The trade taken: it is published by the same `actions` organisation as
  # `checkout`, it is SHA-pinned like the other two, and the alternative is
  # `cosign` plus a Sigstore workflow written by hand in the file that holds the
  # write tokens — which is more code, not less surface. What is *not* traded is
  # the permission: `id-token: write` and `attestations: write` live here and
  # nowhere else in this repository.
  #
  # `contents: write` is here for a reason worth stating rather than absorbing:
  # a **draft** release is invisible to a read-scoped token, so a job that reads
  # one is a job that holds write. That is the price of the draft-first shape
  # this workflow chose at the top, and it is a real cost — this job cannot
  # build anything, but it could edit the release it is describing.
  attest:
    name: provenance
    needs: [draft, checksums, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # One file, not twelve. `subject-checksums` takes exactly the
      # `sha256sum` format the previous job already produced from an enumerated
      # list, so the set of things attested is the set of things checksummed, by
      # construction rather than by two lists agreeing. Downloading the twelve
      # binaries again to hash them here would be a second enumeration, and two
      # enumerations are one more than can be kept in step.
      - name: The checksum file, which names what is attested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS
          # Twelve archives and SBOMs, and a run that attested a truncated list
          # would look exactly like a run that attested a full one.
          lines=$(wc -l < SHA256SUMS)
          if [[ "$lines" -ne 12 ]]; then
            echo "::error::SHA256SUMS names $lines assets; the release ships 12"
            exit 1
          fi
          cat SHA256SUMS

      - name: Attest the archives and the SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      # The image is attested by digest and separately, because a container is
      # not a file on a release and `ghcr.io` is not this repository. Same
      # identity, same run, different subject.
      #
      # `push-to-registry` is deliberately off. It would also store the
      # attestation next to the image on `ghcr.io`, which is a genuine
      # convenience for tooling that only speaks OCI — and it requires
      # `packages: write` on this job, which is the one job in this repository
      # holding a signing identity. Widening the signer to gain a second copy of
      # a statement GitHub already serves is the wrong side of that trade;
      # `gh attestation verify oci://…` resolves the digest at the registry and
      # reads the attestation from the API, which is the command the README
      # publishes and the one the step below runs.
      - name: Attest the server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.container.outputs.image }}
          subject-digest: ${{ needs.container.outputs.digest }}

      # An attestation nobody can check is a badge. This runs the command the
      # README tells a downloader to run, against the artefacts this run just
      # produced, on every release — so the day the verification stops working
      # is a red release rather than a bug report from somebody who trusted the
      # badge. It is `docs/RISKS.md` R15 pointed at a supply-chain claim: a
      # guard that has never rejected anything is a guard nobody has verified.
      - name: Verify what was just attested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
          IMAGE: ${{ needs.container.outputs.image }}
          DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          set -euo pipefail

          # One asset, downloaded and verified as a file rather than as a
          # digest, so that the check exercises the path a person actually
          # takes: download, then ask whether this is what it claims to be.
          asset="moba-server-v${{ needs.draft.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "$TAG" --pattern "$asset"

          # `--signer-workflow` is the part that makes this a check rather than
          # a formality. Without it the command answers "something in this
          # repository built this", which a pull-request workflow also
          # satisfies; with it, the answer is that the release pipeline did.
          # The README publishes the flag for the same reason.
          #
          # Retried, because an attestation is written to a transparency log and
          # an index a few seconds behind the job that created it. A verification
          # that failed on the first attempt would be a red release describing a
          # propagation delay rather than a broken claim, and the failure this
          # step exists to catch does not go away with a second look.
          verify() {
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$1" \
                   --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then
                return 0
              fi
              echo "attempt $attempt did not verify $1 yet; waiting"
              sleep 15
            done
            echo "::error::$1 does not verify against this workflow's attestation"
            return 1
          }

          verify "$asset"
          verify "oci://$IMAGE@$DIGEST"

          echo "ok: the archive and the image both verify against this workflow"

  # Everything succeeded, so the draft becomes a release. This is the last step
  # rather than the first because the alternative — publish, then attach — is a
  # release that is briefly a lie.
  publish:
    name: publish
    needs: [draft, build, checksums, container, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: gh release edit "$TAG" --draft=false
