name: ci

on:
  pull_request:
  push:
    branches: [main]

# Elevate per job, never here. No job in this workflow writes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # The toolchain comes from rust-toolchain.toml: rustup installs it on the
      # first cargo invocation, so there is no toolchain action to keep in sync.
      # Third-party actions are pinned by tag until Renovate lands at M3; SHA
      # pins without something to bump them are pins that rot.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked
