name: ci

on:
  pull_request:
  push:
    branches: [main]

# Elevate per job, never here. No job in this workflow writes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The toolchain comes from rust-toolchain.toml: rustup installs it on the
      # first cargo invocation, so there is no toolchain action to keep in sync.
      #
      # Third-party actions are pinned by commit SHA with the tag beside them in
      # a comment. A tag is a mutable pointer and whoever controls the action's
      # repository can move it (`docs/RISKS.md` R12); a SHA cannot be moved. The
      # pins arrive in the same change as Renovate's configuration and not one
      # commit earlier, because a SHA pin with nothing to bump it is an
      # unpatched action wearing a security measure — R12 says the two land
      # together or not at all, and this is them landing together.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

      # The property suites outside `sim`, at a budget a developer would not
      # wait for. `determinism.yml` raises `PROPTEST_CASES` for `sim`'s own
      # properties across three targets because those are determinism claims;
      # these two are not, so they run once, here, on Linux.
      #
      # 4096 rather than the 16384 the determinism job uses, and the number is
      # measured rather than picked: the traffic suite drives a whole match per
      # case, and 4096 costs about twenty seconds against this job's five-minute
      # budget. Raising it further buys sampling in a space the scripted
      # scenarios beside those properties already cover deliberately.
      #
      # `anticheat`'s joined at M8 and costs a fraction of a second: its draws
      # are lists of latencies rather than whole matches, and what it asserts is
      # the *meaning* of a score — the spread is zero exactly when every answer
      # took the same number of ticks — which the mutation pass showed is the
      # load-bearing choice in that statistic.
      - name: Property suites at CI's budget
        if: runner.os == 'Linux'
        env:
          PROPTEST_CASES: 4096
        run: |
          cargo test -p protocol -p server -p anticheat --locked \
            --test wire --test traffic --test statistics

      # docs/RISKS.md R5: `State` must not be serializable, anywhere, ever.
      # Today the enforcement is stronger than this grep — `sim` has no
      # serialization dependency at all, so no type in it *can* derive one — but
      # `serde` arrives at M2 for the view types, and this is the check that
      # keeps the property from quietly reverting to a code-review habit the
      # moment it does. `sim/src/view` is excluded because the view types are
      # the one thing that is allowed to cross the wire.
      #
      # Linux only: it reads the working tree, not the build, so running it a
      # second time on Windows would buy nothing.
      - name: No serialization on the state types
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=$(git grep -nE '\b(Serialize|Deserialize)\b' -- \
            sim/src ':(exclude)sim/src/view' ':(exclude)sim/src/view.rs' || true)
          if [[ -n "$found" ]]; then
            echo "::error::a serialization derive reached sim outside the view types (docs/RISKS.md R5)"
            echo "$found"
            exit 1
          fi
          echo "ok: no serialization derive in sim outside sim/src/view"

      # docs/ARCHITECTURE.md invariant 1: `sim` depends on nothing. It is the
      # verification kernel — the same `step` runs in the server, in replay
      # verification, in the determinism suite and eventually in the RL
      # environment — and any upward dependency lets those consumers drift
      # apart. The document already asks `cargo tree` to enforce the two
      # dependency rules for `cheat-client` and `client`; this is the one that
      # matters most, and until now it was checked by reading an empty
      # `[dependencies]` table rather than by running anything.
      #
      # `--edges normal` excludes dev-dependencies deliberately: `proptest` is
      # a real and sanctioned dev-dependency of `sim` (its manifest says why),
      # and it links into the test harness, never into the crate. So the
      # assertion is that the normal dependency graph of `sim` is exactly one
      # node: itself.
      - name: sim depends on nothing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tree=$(cargo tree -p sim --edges normal --locked)
          echo "$tree"
          if [[ "$(printf '%s\n' "$tree" | grep -c .)" -ne 1 ]]; then
            echo "::error::sim gained a dependency (docs/ARCHITECTURE.md, docs/RISKS.md R9)"
            exit 1
          fi
          echo "ok: sim's normal dependency graph is itself alone"

      # docs/RISKS.md R3: the corpus never enters git history. `.gitignore`
      # refuses these shapes, and this is what catches the `git add -f` that
      # goes past it — the only way a recording can get in by hand.
      #
      # It checks *tracked* files rather than the working tree, because an
      # untracked recording sitting in a checkout is exactly where a corpus is
      # supposed to be if somebody points the tooling at the wrong directory,
      # and failing CI for that would train the author to ignore this check.
      #
      # Deleting a committed file does not delete it, so this is a check that
      # has to hold on the first commit rather than on the tenth.
      - name: No corpus in git
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=$(git ls-files -- '*.replay' '*.consent' '*.identity' '*.withdrawn' \
            '*.session' '*.session-part' 'corpus/**' || true)
          if [[ -n "$found" ]]; then
            echo "::error::a recording or a consent record is tracked in git (docs/RISKS.md R3)"
            echo "$found"
            exit 1
          fi
          echo "ok: no recording or consent record is tracked"

      # docs/RISKS.md R4, and it arrives with the signature at M5. A replay
      # signing key is a different kind of secret from the corpus and is refused
      # for a different reason: whoever holds it can seal a manifest this
      # project's own verifier accepts, so a committed one is a committed
      # authority to mint evidence. Same irreversibility as R3's — git history
      # and forks — so the check has to hold on the first commit rather than the
      # tenth.
      #
      # The **public** half is deliberately not refused. R4 requires every key,
      # including every retired one, to stay published, because a retired key
      # that stops being published orphans every replay it sealed.
      - name: No signing key in git
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=$(git ls-files -- '*.signing-key' || true)
          if [[ -n "$found" ]]; then
            echo "::error::a replay signing key is tracked in git (docs/RISKS.md R4)"
            echo "$found"
            exit 1
          fi
          echo "ok: no signing key is tracked"

      # docs/ARCHITECTURE.md invariant 7: `client` must not depend on
      # `anticheat`. Shipping detector logic to the machine this project assumes
      # is compromised hands the attacker the thresholds, so the boundary is
      # structural rather than a review habit.
      #
      # `--edges normal` deliberately, and it is doing real work here rather
      # than only excluding a test harness: `client` has `server` as a
      # dev-dependency for the in-process harness that runs M3's exit criterion,
      # which is the allowance `cheat-client` already has for the same reason.
      # The claim is about what `client` *links*, and a dev-dependency is not
      # that.
      - name: client links neither anticheat nor server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tree=$(cargo tree -p client --edges normal --locked)
          echo "$tree"
          if printf '%s\n' "$tree" | grep -qE '(^|[[:space:]])(anticheat|server) v[0-9]'; then
            echo "::error::client gained a dependency on anticheat or server (docs/ARCHITECTURE.md)"
            exit 1
          fi
          echo "ok: client links neither anticheat nor server"

      # docs/ARCHITECTURE.md invariant 6, restated at M7 so that it is a claim
      # something can check. It used to read "no path to `sim`, `client` or
      # `anticheat`", and the first third of that was never true and never could
      # be: `protocol`'s own message types are stated in `sim`'s — a `View`
      # carries a `PlayerView` — so anything that speaks this protocol reaches
      # `sim` through it. Nothing checked, so nothing noticed.
      #
      # What is true, and is what the rule was always about, is that the attacker
      # has exactly the surface a third party reading the wire format would have.
      # So: `protocol` is its only *direct* dependency besides the signature
      # library `forge` needs, `sim` appears only underneath `protocol`, and
      # there is no path at all to `client`, `server`, `replay` or `anticheat` —
      # the rules engine, the real client, the authority, the verifier and the
      # detectors are all on the other side of the line. `sim`, `server` and
      # `replay` are dev-dependencies for the exploit harness, which is why this
      # is `--edges normal`.
      - name: the attacker links the protocol and nothing of the victim
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tree=$(cargo tree -p cheat-client --edges normal --locked)
          echo "$tree"
          if printf '%s\n' "$tree" | grep -qE '(^|[[:space:]])(anticheat|client|server|replay) v[0-9]'; then
            echo "::error::cheat-client gained a dependency on the victim (docs/ARCHITECTURE.md invariant 6)"
            exit 1
          fi
          # `sim` may appear, but only beneath `protocol`: a direct edge would
          # mean the attacker took a dependency on the rules engine itself.
          # `--depth 1` is the crate and its direct dependencies and nothing
          # else, so this is an exact question rather than a grep over a drawing.
          direct=$(cargo tree -p cheat-client --edges normal --depth 1 --locked)
          echo "$direct"
          if printf '%s\n' "$direct" | grep -qE '(^|[[:space:]])sim v[0-9]'; then
            echo "::error::cheat-client took a direct dependency on sim (docs/ARCHITECTURE.md invariant 6)"
            exit 1
          fi
          echo "ok: the attacker links protocol, and reaches sim only through it"

      # docs/ARCHITECTURE.md: `anticheat` is a pure function from telemetry to
      # scores and does no I/O. That is what makes a detector reproducible from
      # a stored match rather than from a server that happened to be running,
      # and it is what lets `anticheat/tests/` score a bot match without a
      # filesystem anywhere near it.
      #
      # `src/bin/` is excluded because the operator's tool is exactly the place
      # the directory walking is supposed to live — the rule is about the
      # library, which is what other crates link. A grep rather than a lint
      # because there is no lint for "this crate opens no files", and it is the
      # same shape of check as the `Serialize` grep in `sim`: textual, cheap,
      # and pointed at the one thing it is about.
      - name: anticheat does no I/O
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=$(git grep -nE '\b(std::fs|std::net|std::process|std::env|File::open|read_to_string)\b' -- \
            anticheat/src ':(exclude)anticheat/src/bin' || true)
          if [[ -n "$found" ]]; then
            echo "::error::anticheat's library reached for I/O (docs/ARCHITECTURE.md)"
            echo "$found"
            exit 1
          fi
          echo "ok: anticheat's library opens nothing"

      # docs/RISKS.md R7 and SECURITY.md: the cheat client is a first-class crate
      # and it must not be in anything that ships. A dev-dependency does not ship
      # and neither does a test; what would ship is a production binary that
      # linked it, and this is the check that says it does not.
      #
      # It is the mirror of the checks above — those keep the victim out of the
      # attacker, this keeps the attacker out of the victim — and it is asserted
      # rather than assumed for the same reason invariant 6 needed rewriting: an
      # exclusion nobody runs is an exclusion nobody has.
      - name: no production binary links the attacker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          failed=0
          for crate in server client sim protocol replay anticheat; do
            tree=$(cargo tree -p "$crate" --edges normal --locked)
            if printf '%s\n' "$tree" | grep -qE '(^|[[:space:]])cheat-client v[0-9]'; then
              echo "::error::$crate links cheat-client (SECURITY.md, docs/RISKS.md R7)"
              printf '%s\n' "$tree"
              failed=1
            fi
          done
          [[ "$failed" -eq 0 ]]
          echo "ok: no crate in the production graph links cheat-client"

      # docs/MILESTONES.md M7's exit criterion, with its report, and M4's
      # lockstep count beside it.
      #
      # `cargo test --workspace` above already ran both of these, on both
      # platforms, so this step buys one thing and it is not coverage:
      # `--nocapture`, so the exploit-by-exploit account — which attack
      # succeeded against which weakened defence, and which failed against the
      # real one — is in the run summary rather than only in a failure.
      # `docs/RISKS.md` R15's hedge is that the number is printed even when it
      # passes, because the value of the counter is that a reader sees it and
      # asks the question.
      #
      # A step rather than the separate `exploits` job `docs/ENGINEERING.md`
      # planned: a job that re-runs tests `check` has run is a second automation
      # returning the same information, which is exactly what R11 says to
      # refuse.
      #
      # **It ran on Linux alone until M8, and that was R15's failure with the
      # assertion still green.** A counter whose whole value is that a reader
      # sees it was printed on one of the two platforms this project supports —
      # so `docs/RISKS.md` R16's live question, whether `windows-latest` bunches
      # a client's frames more often than `ubuntu-latest` does at the same tick
      # period, was a question nobody could answer from a run log. The M4
      # criterion *asserts* correctly on both; only its numbers were unreadable
      # on one. So the step runs on both, and `m4_exit` is in it because that is
      # where the bunching count lives.
      #
      # What it costs: `m4_exit` plays a thousand ticks at the game's own 33 ms,
      # so this is about thirty-five seconds a platform on an already-compiled
      # workspace, against `ci`'s five-minute budget. That is the price of the
      # number, and R16 has already been re-diagnosed twice for want of it.
      - name: The exploit suite, the detectors, the M4 lockstep count
        shell: bash
        run: |
          cargo test -p cheat-client --locked -- --nocapture
          cargo test -p anticheat --locked -- --nocapture
          cargo test -p client --locked --test m4_exit -- --nocapture

  # docs/CONSENT.md declares its own version and `replay::consent::CURRENT`
  # repeats it; a unit test fails when the two disagree. What that test cannot
  # see is the edit that changes the document and leaves *both* alone, which is
  # the case that matters: a consent text that gained a field has stopped being
  # the text somebody signed, and every consent record in the corpus would still
  # claim to be current.
  #
  # This is `determinism.yml`'s `sim-version` job one level up and for the same
  # reason (docs/RISKS.md R13): a number bumped by convention is a number
  # forgotten on the Tuesday it matters. A spurious bump costs a line and a
  # conversation; a missed one costs a corpus nobody can state the basis for. The
  # check is set to demand the cheap mistake.
  #
  # A job of its own rather than a step in `check`, because it is the one thing
  # here that needs the whole history and `check` runs twice.
  consent-version:
    name: consent version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The check is a comparison against the base of the pull request, and
          # a shallow clone does not contain it.
          fetch-depth: 0

      - name: Require a consent-version bump for a change to the consent text
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$(git diff --name-only "$BASE"...HEAD -- docs/CONSENT.md)" ]]; then
            echo "ok: this pull request does not touch docs/CONSENT.md"
            exit 0
          fi

          version_of() {
            git show "$1:docs/CONSENT.md" 2>/dev/null \
              | sed -n 's/^consent-version: \([0-9][0-9-]*\)$/\1/p' | head -1
          }

          head_version=$(version_of HEAD)
          base_version=$(version_of "$BASE")

          if [[ -z "$head_version" ]]; then
            echo "::error file=docs/CONSENT.md::docs/CONSENT.md must declare a consent-version line"
            exit 1
          fi
          if [[ -z "$base_version" ]]; then
            echo "ok: the consent text gained a version ($head_version)"
            exit 0
          fi
          # Dates, so a lexical comparison is a chronological one. Strictly
          # later, not merely different: a version that moved backwards would
          # readmit records signed against a text nobody is operating.
          if [[ "$head_version" > "$base_version" ]]; then
            echo "ok: consent document $base_version -> $head_version"
            exit 0
          fi
          echo "::error file=docs/CONSENT.md::this pull request changes docs/CONSENT.md but leaves its version at $base_version."
          echo "Raise the consent-version line and replay::consent::CURRENT together. Every consent record"
          echo "carries the version its participant signed, so a text that changed without the version means"
          echo "every record in the corpus claims to have been signed against a document that no longer exists."
          exit 1
