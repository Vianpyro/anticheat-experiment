name: determinism

# The single property everything else in this repository rests on: the same
# seed and the same input log produce the same `State::digest()` on every
# supported target. Replays, resimulation, the human corpus and the detector
# calibration all inherit it, so a leak found late invalidates recorded data and
# not just code (docs/RISKS.md R1).
#
# The path filter is what makes this cheap enough to run on every change that
# could break it, and getting it wrong is silent in the worst direction: a job
# that never triggers looks exactly like a job that always passes. So the list
# below covers not only the simulation and the fixtures but the toolchain pin
# and the lockfile, because "a compiler upgrade perturbed the arithmetic" is
# precisely the scenario R1 is about, and the workflow file itself, so a change
# to these rules is validated by the rules it changes.
#
# If this workflow is ever made a required status check, note that a path filter
# on `pull_request` means it does not report at all on unrelated pull requests,
# which blocks them. Require it only alongside a fallback, or not at all.
on:
  pull_request:
    paths:
      - "sim/**"
      - "replay/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/determinism.yml"
  push:
    branches: [main]
    paths:
      - "sim/**"
      - "replay/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/determinism.yml"

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # `rules_hash()` covers the constants. Nothing covers the order of operations
  # in `step`, so two builds can agree on every rule and still resimulate a
  # replay differently — which is why the replay manifest carries a `sim`
  # version at M5 (docs/RISKS.md R13). A version bumped by hand is a version
  # forgotten by hand, so this is the mechanism: touch `sim/`, raise the number,
  # or the pull request does not merge.
  #
  # It runs on pull requests only. There is no base to compare a push to `main`
  # against once the pull request that produced it has already been checked.
  sim-version:
    name: sim version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The whole history: the check is a comparison against the base of the
          # pull request, and a shallow clone does not contain it.
          fetch-depth: 0

      - name: Require a version bump for a change to sim
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # This workflow also triggers on `replay/`, the lockfile and the
          # toolchain pin. Those are changes that can perturb the simulation
          # without changing `sim`'s own sources, and a version this crate does
          # not own is not something this check can ask for; the fixture jobs
          # are what covers them. See R13 for that gap, which is deliberate.
          if [[ -z "$(git diff --name-only "$BASE"...HEAD -- sim/)" ]]; then
            echo "ok: this pull request does not touch sim/"
            exit 0
          fi

          version_of() {
            # `sim` declares an explicit `version = "x.y.z"`; every other crate
            # inherits the workspace's. An empty result means the declaration
            # was removed, which is a failure of its own below.
            git show "$1:sim/Cargo.toml" 2>/dev/null \
              | sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' | head -1
          }

          head_version=$(version_of HEAD)
          base_version=$(version_of "$BASE")

          if [[ -z "$head_version" ]]; then
            echo "::error file=sim/Cargo.toml::sim must declare its own version (docs/RISKS.md R13)"
            exit 1
          fi
          if [[ -z "$base_version" ]]; then
            echo "ok: sim gained an explicit version ($head_version)"
            exit 0
          fi
          # Strictly greater, not merely different: a version that moves
          # backwards orders two builds wrongly, which is worse than not
          # ordering them at all. `sort -V` is the comparison, and the guard is
          # that the lower of the two is the base and they are not equal.
          if [[ "$head_version" != "$base_version" ]] \
            && [[ "$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | head -1)" == "$base_version" ]]; then
            echo "ok: sim $base_version -> $head_version"
            exit 0
          fi
          echo "::error file=sim/Cargo.toml::this pull request changes sim/ but leaves its version at $base_version."
          echo "Raise it in sim/Cargo.toml: the replay manifest carries this number, and a build that"
          echo "reorders step without changing rules_hash() is otherwise indistinguishable from its"
          echo "predecessor (docs/RISKS.md R13). Patch for a change that cannot move a digest, minor otherwise."
          exit 1

  fixture:
    name: fixture (${{ matrix.arch }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
          - os: windows-latest
            arch: x86-64
          # The reason the matrix exists. aarch64 is what catches the
          # determinism leaks an x86-only matrix hides, so this entry is here
          # for a security reason and not for macOS support
          # (docs/ENGINEERING.md, platform matrix). `macos-14` is named
          # explicitly rather than `macos-latest` because the architecture is
          # the requirement; when GitHub retires the label, bump it to another
          # aarch64 image rather than to whatever `latest` happens to mean.
          - os: macos-14
            arch: aarch64

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `--release` deliberately, and it is the same profile on all three: the
      # workspace turns `overflow-checks` on in every profile precisely so that
      # this can run against optimised code without arithmetic meaning
      # something different here than it does under `cargo test`.
      - name: Run the fixture
        shell: bash
        run: cargo test -p sim --release --locked --test determinism -- --nocapture | tee determinism.log

      # The digests are echoed into the run summary so that a three-way
      # disagreement is one glance rather than three logs opened side by side.
      - name: Report the digests
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.arch }} ${{ matrix.os }}"
            echo ''
            echo '```'
            grep '^determinism:' determinism.log || echo 'no digest reported: the fixture did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The property tests, on the same three targets and with a budget CI can
  # afford and a developer cannot. 256 cases is proptest's default and it is
  # tuned for the edit-compile-test loop; the interesting counter-examples in a
  # fixed-point library live in a thin shell near the ends of the domain, and
  # the difference between sampling it a few hundred times and a few thousand is
  # the difference between finding them this year and finding them in the
  # corpus. A case this job discovers is written into
  # `sim/proptest-regressions/`, which is committed, so it becomes a permanent
  # test rather than one lucky run — see the header of
  # `sim/tests/properties.rs`.
  #
  # Two binaries: `properties` covers the fixed-point arithmetic and `step`,
  # `view_properties` covers the visibility projection over states reached by
  # simulation. They run in one job under one budget deliberately — the case
  # count is the thing that must not drift between them, since a property that
  # runs at 256 cases while its neighbour runs at 16384 is a property nobody
  # decided to sample less.
  properties:
    name: properties (${{ matrix.arch }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
          - os: windows-latest
            arch: x86-64
          - os: macos-14
            arch: aarch64

    env:
      # Sixty-four times proptest's default of 256, which is a number tuned for
      # an edit-compile-test loop rather than for CI. Measured rather than
      # guessed: the whole suite runs in about a second and a half under
      # `--release` at this budget, so the job's cost is its compile, and the
      # case count is free until it is orders of magnitude larger.
      PROPTEST_CASES: 16384

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `--release`, for the reason the fixture job runs release: overflow
      # checks are on in every profile, so this exercises the optimised code
      # without arithmetic meaning something different than it does under
      # `cargo test`.
      - name: Run the property tests
        run: cargo test -p sim --release --locked --test properties --test view_properties

      # A counter-example is worth nothing if it dies with the runner, and the
      # runner is where this one was found: proptest appends the failing seed to
      # the regressions file, and that file is on a machine that is about to be
      # destroyed. So it is printed into the run summary, from where it is
      # pasted into the committed file — which is what turns a failure found
      # here once into a case every future run replays first.
      #
      # Printed rather than uploaded as an artifact deliberately: an upload
      # action would be a third third-party action in this repository, and
      # `docs/RISKS.md` R12 holds that count at two until Renovate arrives to
      # keep SHA pins current. Six lines of `cat` are not worth a supply-chain
      # surface.
      - name: Report any new regression seeds
        if: failure()
        shell: bash
        run: |
          {
            echo "### new proptest regression seeds (${{ matrix.arch }} ${{ matrix.os }})"
            echo ''
            echo 'Paste any `cc` line below into the file it is listed under, in'
            echo '`sim/proptest-regressions/`.'
            echo ''
            echo '```'
            grep -H '^cc ' sim/proptest-regressions/*.txt \
              || echo 'none: the failure was not a property counter-example'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
