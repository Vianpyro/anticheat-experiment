# `release-plz`, in release-pull-request mode and in no other mode.
#
# What it is allowed to do: read the conventional commits since the last tag,
# work out which crates their file paths belong to, compute the next version,
# write `CHANGELOG.md`, and open a pull request with those two changes in it.
#
# What it is not allowed to do, and every one of these is switched off below
# rather than merely unused: create a git tag, create a GitHub release, run
# `cargo publish`, or push to `main`. `docs/ENGINEERING.md`'s "what stays
# manual" table puts "pushing the release tag" first — a human decides that a
# version exists — and `docs/RISKS.md` R11 is about the other half: an
# automation that rewrites a branch while you are working on it is a
# supply-chain surface and a source of confusing history, and `super-linter` was
# deleted for exactly that. So the tool's output is a pull request, which is a
# proposal, and merging it is a person's act.
#
# The workflow only ever invokes `release-plz release-pr`. The `release`
# command, which is the one that tags and publishes, is not wired to anything.
# The switches below mean that running it by hand would still not tag or
# publish.

[workspace]
# `git_tag_enable` and `git_release_enable`: the tag is the trigger for
# `.github/workflows/release.yml`, and that workflow builds the release. A tool
# that tagged would be deciding that a version exists.
git_tag_enable = false
git_release_enable = false

# Every crate in this workspace is `publish = false` in its manifest already —
# `docs/ENGINEERING.md` says why, and "publishing a crate named `cheat-client`
# to a public registry would be a poor decision independently" is the short
# version. This repeats it here so that the refusal does not depend on a
# manifest field somebody could inherit differently.
publish = false

# And this is the consequence of that, which is not optional and is easy to get
# wrong silently. By default release-plz asks crates.io what the last released
# version of a package was. No crate here is on crates.io, so the answer is
# "nothing" for all seven, and the tool does nothing at all — no error, no
# pull request, an empty run. `git_only` points it at the git tags instead,
# which is where this project's release history actually lives.
git_only = true

# The tag the history is read from, and it has to match the tag a human pushes.
# `.github/workflows/release.yml` triggers on `v*` and `docs/ENGINEERING.md`
# names one tag per release, not one per crate; release-plz's default in a
# workspace is `{{ package }}-v{{ version }}`, which would look for seven tags
# that will never exist and read every release as the first one.
git_tag_name = "v{{ version }}"

# `cargo-semver-checks` is for crates other people link. Nothing here is on
# crates.io and nothing ever will be, so it would spend minutes per run
# answering a question with no consumer.
semver_check = false

# The lockfile is committed and CI builds `--locked`; a release pull request
# that also ran `cargo update` would mix "we are naming a version" with "we are
# changing the dependency graph". Renovate owns the second one, weekly, with its
# own review point (`docs/ENGINEERING.md`).
dependencies_update = false

# One changelog, at the root, because a release of this project is one set of
# binaries and not seven crates. Seven `CHANGELOG.md` files whose entries all
# carry the same workspace version would be six files nobody reads and one the
# release workflow has to guess at.
#
# `changelog_update = false` on the other crates and `changelog_include` on this
# one is how release-plz expresses that: `server` owns the file, and the commits
# that belong to the other crates are folded into its section. `server` rather
# than `client` because the container image is the artefact this release exists
# to hand somebody, but nothing rests on the choice — it is the crate whose
# changelog happens to be the project's.
changelog_update = false

[changelog]
# Keep-a-changelog, which is what `.github/workflows/release.yml` parses out of
# `CHANGELOG.md` to fill the release notes. If this is ever customised, that
# `awk` is what has to keep working.
protect_breaking_commits = true

[[package]]
name = "server"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["anticheat", "cheat-client", "client", "protocol", "replay"]

# `sim` is the one crate release-plz does not touch, and this is the whole of
# how that is said: `release = false` takes it out of `update`, `release-pr` and
# `release` alike.
#
# `docs/RISKS.md` R13 is why. `sim` owns its version rather than inheriting the
# workspace's, because `rules_hash()` covers the constants and nothing covers
# the order of operations in `step` — so that number is what tells two builds
# apart when a replay resimulates differently, and the `sim-version` job in
# `.github/workflows/determinism.yml` refuses a pull request that touches `sim/`
# without raising it. A release-plz that also bumped it would be a second
# mechanism for one number, and a number with two owners has none.
#
# The human keeps it, for two reasons that are about meaning rather than tidiness:
#
# - **Granularity.** R13 wants a number that distinguishes *builds*. The manual
#   bump lands in the pull request that changes the rules; a release-time bump
#   would give every replay recorded between two releases the same `sim` version
#   across a step reorder, which is exactly the case R13 exists to catch.
# - **The rule it is bumped by.** `sim/Cargo.toml` says patch for a change that
#   cannot move a digest and minor for anything that can — a judgement about
#   determinism. Conventional commits encode a different judgement: a `refactor:`
#   or `perf:` that reorders `step` is a patch under semver and a minor under
#   R13, and the tool would quietly overrule the rule.
#
# What this costs, stated because it will be met eventually: release-plz
# attributes a commit to the crate whose files it touches, so a change confined
# to `sim/` is attributed to a package release-plz does not process — and a
# release cycle containing only rules changes will propose no version at all.
# Raise `[workspace.package] version` by hand in that case; `release.yml` checks
# the tag against it either way, so a mistake there fails before an artefact
# exists.
[[package]]
name = "sim"
release = false
